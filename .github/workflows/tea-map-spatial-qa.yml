name: Tea Map Spatial QA

on:
  push:
    branches:
      - tea-map-spatial-qa-20260907

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout runner repository
        uses: actions/checkout@v4

      - name: Checkout locked ChinaGeoJson snapshot
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/zhChuXiao/ChinaGeoJson.git reference_repo
          git -C reference_repo checkout 7aa2c5fabc6a892015625898c3482874b233f9de

      - name: Install validator
        run: python -m pip install --disable-pip-version-check --quiet shapely

      - name: Recover invalid snapshot districts
        shell: bash
        run: |
          set -euo pipefail
          cat > recovery.py <<'PY'
          import csv, hashlib, json, math, time, urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          from shapely.geometry import shape
          from shapely.validation import explain_validity

          REPO=Path('reference_repo')
          OUT=Path('recovery'); RAW=OUT/'raw'; NORM=OUT/'normalized'
          for p in (OUT,RAW,NORM): p.mkdir(parents=True,exist_ok=True)
          BASE='https://geo.datav.aliyun.com/areas_v3/bound/'
          COMMIT='7aa2c5fabc6a892015625898c3482874b233f9de'
          info=json.load(open(REPO/'info.json',encoding='utf-8'))
          meta={str(c):r for c,r in info.items() if isinstance(r,dict) and r.get('level')=='district'}

          def shab(b): return hashlib.sha256(b).hexdigest()
          def can(o): return shab(json.dumps(o,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode())
          def shp(p):
              h=hashlib.sha256()
              with open(p,'rb') as f:
                  for x in iter(lambda:f.read(1048576),b''): h.update(x)
              return h.hexdigest()
          def valid_geom(g):
              if not isinstance(g,dict): return False,'GEOM_MISSING'
              if g.get('type') not in {'Polygon','MultiPolygon'}: return False,'GEOM_TYPE:'+str(g.get('type'))
              if not g.get('coordinates'): return False,'GEOM_EMPTY'
              try:
                  sg=shape(g)
                  if sg.is_empty: return False,'GEOM_EMPTY'
                  if not sg.is_valid: return False,'GEOM_INVALID:'+explain_validity(sg)
              except Exception as e: return False,'GEOM_ERROR:'+repr(e)
              return True,''

          self_files={}
          for folder in [REPO/'county',REPO/'citys']:
              for p in folder.glob('*.json'):
                  try: o=json.load(open(p,encoding='utf-8-sig'))
                  except: continue
                  fs=o.get('features',[]) if isinstance(o,dict) else []
                  if len(fs)!=1: continue
                  pr=fs[0].get('properties') or {}; c=str(pr.get('adcode'))
                  if c in meta and pr.get('level')=='district' and c not in self_files: self_files[c]=p

          invalid=[]
          for c,p in self_files.items():
              o=json.load(open(p,encoding='utf-8-sig')); f=o['features'][0]
              ok,why=valid_geom(f.get('geometry'))
              if not ok: invalid.append((c,p,why))
          invalid.sort()
          print('snapshot invalid districts',len(invalid))

          def get(c):
              url=BASE+c+'.json'; dest=RAW/(c+'.json')
              last=None
              for i in range(4):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 TeaMapRecovery/1.0'})
                      with urllib.request.urlopen(req,timeout=15) as r: b=r.read()
                      dest.write_bytes(b); return c,True,'',len(b),shab(b)
                  except Exception as e: last=e; time.sleep(.25*(i+1))
              return c,False,repr(last),0,''

          results={}
          with ThreadPoolExecutor(max_workers=12) as ex:
              futs=[ex.submit(get,c) for c,_,_ in invalid]
              for f in as_completed(futs):
                  c,ok,err,n,sha=f.result(); results[c]=(ok,err,n,sha)

          rows=[]; recovered=[]; still=[]
          for c,p,oldwhy in invalid:
              rec=meta[c]; okdl,err,n,sha=results[c]
              row={'adcode':c,'name':rec.get('name'),'old_source':str(p.relative_to(REPO)),'old_source_sha256':shp(p),'old_issue':oldwhy,'direct_download':'OK' if okdl else 'FAIL','direct_bytes':n,'direct_sha256':sha,'direct_status':'FAIL','direct_issue':err,'normalized_sha256':''}
              if okdl:
                  try: o=json.load(open(RAW/(c+'.json'),encoding='utf-8-sig'))
                  except Exception as e: o=None; row['direct_issue']='JSON_PARSE:'+repr(e)
                  if isinstance(o,dict):
                      fs=o.get('features',[]); matches=[x for x in fs if str((x.get('properties') or {}).get('adcode'))==c]
                      f=matches[0] if len(matches)==1 else (fs[0] if len(fs)==1 else None)
                      if f is None: row['direct_issue']='ADCODE_NOT_FOUND'
                      else:
                          pr=f.get('properties') or {}; par=pr.get('parent') or {}; expected_parent=str((rec.get('parent') or {}).get('adcode'))
                          prop_err=[]
                          if str(pr.get('adcode'))!=c: prop_err.append('ADCODE_MISMATCH')
                          if pr.get('name')!=rec.get('name'): prop_err.append('NAME_MISMATCH')
                          if pr.get('level')!='district': prop_err.append('LEVEL_MISMATCH')
                          if str(par.get('adcode'))!=expected_parent: prop_err.append('PARENT_MISMATCH')
                          vg,why=valid_geom(f.get('geometry'))
                          if prop_err: row['direct_issue']=';'.join(prop_err)
                          elif not vg: row['direct_issue']=why
                          else:
                              row['direct_status']='RECOVERED'; row['direct_issue']=''
                              norm={'type':'FeatureCollection','features':[{'type':'Feature','properties':{'asset_id':'ADM-'+c,'adcode':int(c),'name':rec.get('name'),'level':'district','parent_adcode':int(expected_parent),'source_type':'DATAV_DIRECT_RECOVERY','source_id':'SRC-DATAV-V3-DIRECT-SNAPSHOT-20260907','source_url':BASE+c+'.json','source_sha256':sha,'geometry_sha256':can(f['geometry']),'supersedes_invalid_snapshot_file':str(p.relative_to(REPO)),'reference_commit':COMMIT,'default_role':'ACTIVE_DEFAULT_CANDIDATE','original_properties':pr},'geometry':f['geometry']}]}
                              op=NORM/('ADM-'+c+'.geojson'); op.write_text(json.dumps(norm,ensure_ascii=False,separators=(',',':')),encoding='utf-8'); row['normalized_sha256']=shp(op); recovered.append(c)
              if row['direct_status']!='RECOVERED': still.append(c)
              rows.append(row)

          fields=list(rows[0].keys()) if rows else ['adcode']
          with open(OUT/'recovery_manifest.csv','w',encoding='utf-8-sig',newline='') as f: w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(rows)
          summary={'invalid_snapshot_districts':len(invalid),'direct_download_success':sum(1 for c in results if results[c][0]),'recovered_count':len(recovered),'still_invalid_count':len(still),'recovered_codes':recovered,'still_invalid_codes':still,'policy':'No geometry repair. Only replace invalid locked-snapshot candidate when current direct DataV base geometry passes all checks.'}
          (OUT/'recovery_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print('=== RECOVERY_SUMMARY ==='); print(json.dumps(summary,ensure_ascii=False,indent=2)); print('=== END_RECOVERY_SUMMARY ===')
          PY
          python recovery.py

      - name: Package recovery results
        shell: bash
        run: |
          tar -czf RECOVERY-DATAV-V3-DISTRICT-20260907.tar.gz recovery

      - name: Upload recovery results
        uses: actions/upload-artifact@v4
        with:
          name: RECOVERY-DataV-V3-DISTRICT-20260907
          path: RECOVERY-DATAV-V3-DISTRICT-20260907.tar.gz
          retention-days: 30
