name: Tea Map Spatial QA

on:
  push:
    branches:
      - tea-map-spatial-qa-20260907

permissions:
  contents: read

jobs:
  app-loader:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout runner repository
        uses: actions/checkout@v4

      - name: Fetch app loader and inspect data URLs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app_probe
          URL='https://geojsoncn.com/app.js?file=%E5%B8%82%2F%E9%87%8D%E5%BA%86%E5%B8%82.json'
          code=$(curl -L --compressed --max-time 12 -A 'Mozilla/5.0 TeaMapAppProbe/1.0' -sS -w '%{http_code}' -o app_probe/app.js "$URL" || true)
          echo "HTTP=$code BYTES=$(wc -c < app_probe/app.js 2>/dev/null || echo 0)"
          if [ -s app_probe/app.js ]; then
            grep -n -E 'fetch\(|XMLHttpRequest|axios|\.json|download|geojson|file=|DATA|mapData|api/' app_probe/app.js | head -n 200 || true
            sed -n '1,220p' app_probe/app.js > app_probe/head.txt
          fi

      - name: Package and upload
        shell: bash
        run: tar -czf GEOJSONCN-APP-LOADER-20260907.tar.gz app_probe

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GEOJSONCN-APP-LOADER-20260907
          path: GEOJSONCN-APP-LOADER-20260907.tar.gz
          retention-days: 30
