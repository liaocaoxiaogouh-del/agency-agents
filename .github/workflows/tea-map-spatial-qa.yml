name: Tea Map Spatial QA

on:
  push:
    branches:
      - tea-map-spatial-qa-20260907

permissions:
  contents: read

jobs:
  static-city-files:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout runner repository
        uses: actions/checkout@v4

      - name: Fetch current city GeoJSON static files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p static_test
          cat > static_test/run.sh <<'SH'
          #!/usr/bin/env bash
          set -u
          fetch_one() {
            key="$1"; url="$2"
            code=$(curl -L --compressed --max-time 8 -A 'Mozilla/5.0 TeaMapStaticProbe/1.0' -sS -w '%{http_code}' -o "static_test/${key}.bin" "$url" || echo ERR)
            size=$(wc -c < "static_test/${key}.bin" 2>/dev/null || echo 0)
            ctype=$(file -b --mime-type "static_test/${key}.bin" 2>/dev/null || true)
            printf '%s\t%s\t%s\t%s\n' "$key" "$code" "$size" "$ctype" > "static_test/${key}.meta"
          }
          fetch_one cq 'https://geojsoncn.com/%E5%B8%82/%E9%87%8D%E5%BA%86%E5%B8%82.json' &
          fetch_one linzhi 'https://geojsoncn.com/%E5%B8%82/%E6%9E%97%E8%8A%9D%E5%B8%82.json' &
          fetch_one shannan 'https://geojsoncn.com/%E5%B8%82/%E5%B1%B1%E5%8D%97%E5%B8%82.json' &
          fetch_one hetian 'https://geojsoncn.com/%E5%B8%82/%E5%92%8C%E7%94%B0%E5%9C%B0%E5%8C%BA.json' &
          fetch_one sansha 'https://geojsoncn.com/%E5%B8%82/%E4%B8%89%E6%B2%99%E5%B8%82.json' &
          wait
          cat static_test/*.meta
          SH
          bash static_test/run.sh
          python - <<'PY'
          import json,glob,os
          targets={'cq':['500157'],'linzhi':['540481'],'shannan':['540581'],'hetian':['653228','653229'],'sansha':['460302','460303']}
          out={}
          for key,codes in targets.items():
            p=f'static_test/{key}.bin'; rec={'bytes':os.path.getsize(p) if os.path.exists(p) else 0,'json':False,'matches':{}}
            try:
              obj=json.load(open(p,encoding='utf-8-sig')); rec['json']=True; rec['type']=obj.get('type'); fs=obj.get('features',[]); rec['feature_count']=len(fs)
              for c in codes:
                mm=[]
                for i,f in enumerate(fs):
                  pr=f.get('properties') or {}; vals=[str(pr.get(k,'')) for k in ['adcode','code','gb','gbCode']]
                  if c in vals or ('156'+c) in vals: mm.append({'index':i,'properties':pr,'geometry_type':(f.get('geometry') or {}).get('type')})
                rec['matches'][c]=mm
            except Exception as e: rec['error']=repr(e); rec['prefix']=open(p,'rb').read(100).hex() if os.path.exists(p) else ''
            out[key]=rec
          open('static_test/summary.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Package and upload
        shell: bash
        run: tar -czf GEOJSONCN-STATIC-CITY-TEST-20260907.tar.gz static_test

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GEOJSONCN-STATIC-CITY-TEST-20260907
          path: GEOJSONCN-STATIC-CITY-TEST-20260907.tar.gz
          retention-days: 30
