name: Tea Map Spatial QA

on:
  push:
    branches:
      - tea-map-spatial-qa-20260907

permissions:
  contents: read

jobs:
  mirror-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout runner repository
        uses: actions/checkout@v4

      - name: Checkout secondary mirror snapshot
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/cebarobot/grid-to-chinese-county.git mirror
          git -C mirror checkout fdfdc81fc2d376d42309bafc6a2e6bc764c224e8
          test -f 'mirror/geojson/中国_省.geojson'
          test -f 'mirror/geojson/中国_市.geojson'
          test -f 'mirror/geojson/中国_县.geojson'

      - name: Audit aggregate mirror
        shell: bash
        run: |
          set -euo pipefail
          cat > audit.py <<'PY'
          import csv, hashlib, json
          from collections import defaultdict
          from pathlib import Path

          ROOT=Path('mirror/geojson')
          OUT=Path('audit'); OUT.mkdir(exist_ok=True)
          files={
            'province':ROOT/'中国_省.geojson',
            'city':ROOT/'中国_市.geojson',
            'district':ROOT/'中国_县.geojson',
          }
          def sha(p):
            h=hashlib.sha256()
            with open(p,'rb') as f:
              for x in iter(lambda:f.read(1048576),b''): h.update(x)
            return h.hexdigest()
          def norm(v):
            if v is None:return None
            s=''.join(ch for ch in str(v) if ch.isdigit())
            if len(s)==6:return s
            if len(s)>=9:return s[-6:]
            return None
          by_code=defaultdict(list); unmapped=[]; stats={}; special=[]
          for lvl,p in files.items():
            obj=json.load(open(p,encoding='utf-8-sig')); fs=obj.get('features',[])
            mapped=0
            for i,f in enumerate(fs):
              pr=f.get('properties') or {}; c=norm(pr.get('gb')); name=str(pr.get('name') or '')
              if c:
                mapped+=1; by_code[c].append({'level':lvl,'name':name,'raw_gb':str(pr.get('gb')),'feature_index':i,'source_file':p.name})
              else:
                unmapped.append({'level':lvl,'feature_index':i,'name':name,'properties':json.dumps(pr,ensure_ascii=False)})
              if ('监利' in name) or ('水城' in name):
                special.append({'level':lvl,'feature_index':i,'name':name,'raw_gb':str(pr.get('gb') or ''),'normalized_code':c or '','properties':json.dumps(pr,ensure_ascii=False)})
            stats[lvl]={'features':len(fs),'mapped':mapped,'unmapped':len(fs)-mapped,'bytes':p.stat().st_size,'sha256':sha(p)}
          dups=[]
          for c,items in sorted(by_code.items()):
            if len(items)>1:
              for item in items:
                dups.append({'adcode':c,**item,'duplicate_count':len(items)})
          with open(OUT/'duplicate_codes.csv','w',encoding='utf-8-sig',newline='') as f:
            fields=['adcode','level','name','raw_gb','feature_index','source_file','duplicate_count']; w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(dups)
          with open(OUT/'unmapped_features.csv','w',encoding='utf-8-sig',newline='') as f:
            fields=['level','feature_index','name','properties'];w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(unmapped)
          with open(OUT/'special_name_lookup.csv','w',encoding='utf-8-sig',newline='') as f:
            fields=['level','feature_index','name','raw_gb','normalized_code','properties'];w=csv.DictWriter(f,fieldnames=fields);w.writeheader();w.writerows(special)
          summary={
            'repository':'cebarobot/grid-to-chinese-county',
            'commit':'fdfdc81fc2d376d42309bafc6a2e6bc764c224e8',
            'files':stats,
            'unique_normalized_codes':len(by_code),
            'duplicate_code_count':sum(1 for v in by_code.values() if len(v)>1),
            'duplicate_feature_rows':len(dups),
            'unmapped_feature_count':len(unmapped),
            'special_name_hits':special,
            'provenance_status':'UNVERIFIED_MIRROR_CANDIDATE',
            'promotion_rule':'Do not promote to formal LOCK solely from filename, size, gb field, or geometric validity. Provenance/source-rights review required.'
          }
          (OUT/'mirror_audit_summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          PY
          python audit.py

      - name: Package exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/source
          cp 'mirror/geojson/中国_省.geojson' package/source/
          cp 'mirror/geojson/中国_市.geojson' package/source/
          cp 'mirror/geojson/中国_县.geojson' package/source/
          cp -r audit package/
          printf '%s\n' 'repository=cebarobot/grid-to-chinese-county' 'commit=fdfdc81fc2d376d42309bafc6a2e6bc764c224e8' > package/SNAPSHOT.txt
          sha256sum package/source/* > package/SOURCE_SHA256_MANIFEST.txt
          tar -czf CEBAROBOT-CHINA-ADMIN-MIRROR-SNAPSHOT-20260907.tar.gz package

      - name: Upload mirror snapshot and audit
        uses: actions/upload-artifact@v4
        with:
          name: CEBAROBOT-CHINA-ADMIN-MIRROR-SNAPSHOT-20260907
          path: CEBAROBOT-CHINA-ADMIN-MIRROR-SNAPSHOT-20260907.tar.gz
          retention-days: 30
