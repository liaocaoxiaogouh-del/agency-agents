name: Tea Map Spatial QA

on:
  push:
    branches:
      - tea-map-spatial-qa-20260907

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout runner repository
        uses: actions/checkout@v4

      - name: Checkout locked ChinaGeoJson reference snapshot
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/zhChuXiao/ChinaGeoJson.git reference_repo
          git -C reference_repo checkout 7aa2c5fabc6a892015625898c3482874b233f9de
          test "$(git -C reference_repo rev-parse HEAD)" = "7aa2c5fabc6a892015625898c3482874b233f9de"

      - name: Install geometry validator
        run: python -m pip install --disable-pip-version-check --quiet shapely

      - name: Build combined nationwide DEFAULT candidate and QA
        shell: bash
        run: |
          set -euo pipefail
          cat > tea_map_spatial_qa_v3.py <<'PY'
          import csv
          import hashlib
          import json
          import math
          import time
          import urllib.request
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          from shapely.geometry import shape
          from shapely.validation import explain_validity

          COMMIT = "7aa2c5fabc6a892015625898c3482874b233f9de"
          BASE_URL = "https://geo.datav.aliyun.com/areas_v3/bound/"
          REPO = Path("reference_repo")
          RAW_DIRECT = Path("raw_direct_delta")
          QA = Path("qa_v3")
          NORM = Path("normalized_pass")
          for p in (RAW_DIRECT, QA, NORM): p.mkdir(parents=True, exist_ok=True)

          def sha256_bytes(b): return hashlib.sha256(b).hexdigest()
          def sha256_file(p):
              h=hashlib.sha256()
              with open(p,"rb") as f:
                  for c in iter(lambda:f.read(1024*1024),b""): h.update(c)
              return h.hexdigest()
          def canonical_hash(o): return sha256_bytes(json.dumps(o,ensure_ascii=False,sort_keys=True,separators=(",",":")).encode("utf-8"))

          info=json.load(open(REPO/"info.json",encoding="utf-8"))
          expected={}
          for code,rec in info.items():
              if not isinstance(rec,dict) or rec.get("adcode") is None: continue
              par=rec.get("parent") or {}
              expected[str(code)]={
                  "adcode":str(code),"name":rec.get("name"),"level":rec.get("level"),
                  "parent_adcode":None if par.get("adcode") is None else str(par.get("adcode")),
              }
          subnational={c:r for c,r in expected.items() if r["level"] in {"province","city","district"}}
          expected_counts=Counter(r["level"] for r in subnational.values())

          # Index all single-self district files preserved by the locked repository snapshot.
          repo_district={}
          collision_rows=[]
          for folder in [REPO/"county", REPO/"citys"]:
              for p in sorted(folder.glob("*.json")):
                  try: obj=json.load(open(p,encoding="utf-8-sig"))
                  except Exception: continue
                  feats=obj.get("features",[]) if isinstance(obj,dict) else []
                  if len(feats)!=1: continue
                  props=feats[0].get("properties") or {}
                  code=str(props.get("adcode"))
                  if code in subnational and subnational[code]["level"]=="district" and props.get("level")=="district":
                      if code in repo_district:
                          collision_rows.append({"adcode":code,"first":str(repo_district[code].relative_to(REPO)),"second":str(p.relative_to(REPO))})
                      else:
                          repo_district[code]=p

          missing_district=sorted(c for c,r in subnational.items() if r["level"]=="district" and c not in repo_district)
          direct_targets=sorted(c for c,r in subnational.items() if r["level"] in {"province","city"}) + missing_district
          direct_targets=sorted(set(direct_targets))

          def http_get(url,retries=3,timeout=12):
              last=None
              for i in range(retries):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 TeaMapSpatialQA/1.0"})
                      with urllib.request.urlopen(req,timeout=timeout) as resp:
                          return resp.read()
                  except Exception as e:
                      last=e; time.sleep(0.25*(i+1))
              raise last

          def acquire(code):
              url=BASE_URL+code+".json"; p=RAW_DIRECT/(code+".json")
              try:
                  b=http_get(url); p.write_bytes(b)
                  return {"adcode":code,"status":"OK","bytes":len(b),"sha256":sha256_bytes(b),"url":url,"error":""}
              except Exception as e:
                  return {"adcode":code,"status":"FAIL","bytes":0,"sha256":"","url":url,"error":repr(e)}

          download_rows=[]
          with ThreadPoolExecutor(max_workers=10) as ex:
              futs=[ex.submit(acquire,c) for c in direct_targets]
              for i,f in enumerate(as_completed(futs),1):
                  download_rows.append(f.result())
                  if i%100==0 or i==len(futs):
                      print(f"direct download {i}/{len(futs)} ok={sum(x['status']=='OK' for x in download_rows)}")
          dmap={r["adcode"]:r for r in download_rows}

          details=[]; rows=[]
          def add(code,name,sev,issue,msg): details.append({"adcode":code,"name":name or "","severity":sev,"issue_code":issue,"message":msg})
          def iter_xy(c):
              if isinstance(c,(list,tuple)):
                  if len(c)>=2 and isinstance(c[0],(int,float)) and isinstance(c[1],(int,float)): yield c[0],c[1]
                  else:
                      for z in c: yield from iter_xy(z)

          for code in sorted(subnational):
              meta=subnational[code]; name=meta["name"]; hard=[]
              if meta["level"]=="district" and code in repo_district:
                  src_path=repo_district[code]; source_type="GITHUB_LOCKED_SNAPSHOT"; source_id="SRC-GITHUB-DATAV-CHINAGEOJSON"; source_url="https://github.com/zhChuXiao/ChinaGeoJson/tree/"+COMMIT+"/"+str(src_path.relative_to(REPO))
              else:
                  src_path=RAW_DIRECT/(code+".json"); source_type="DATAV_DIRECT"; source_id="SRC-DATAV-V3-DIRECT-SNAPSHOT-20260907"; source_url=BASE_URL+code+".json"
                  if not dmap.get(code) or dmap[code]["status"]!="OK": hard.append(("DOWNLOAD_FAIL",dmap.get(code,{}).get("error","missing result")))
              obj=None; feature=None; geom=None
              if not hard:
                  try: obj=json.load(open(src_path,encoding="utf-8-sig"))
                  except Exception as e: hard.append(("JSON_PARSE",repr(e)))
              if isinstance(obj,dict):
                  feats=obj.get("features")
                  if obj.get("type")!="FeatureCollection" or not isinstance(feats,list) or not feats:
                      hard.append(("NOT_FEATURE_COLLECTION","expected non-empty FeatureCollection"))
                  else:
                      matches=[f for f in feats if str((f.get("properties") or {}).get("adcode"))==code]
                      if len(matches)==1: feature=matches[0]
                      elif len(feats)==1:
                          feature=feats[0]; hard.append(("ADCODE_RESPONSE_MISMATCH",f"actual={(feature.get('properties') or {}).get('adcode')}"))
                      elif not matches: hard.append(("ADCODE_NOT_FOUND_IN_RESPONSE",f"feature_count={len(feats)}"))
                      else: hard.append(("DUPLICATE_ADCODE_IN_RESPONSE",f"matches={len(matches)}"))
              if feature is not None:
                  props=feature.get("properties") or {}; par=props.get("parent") or {}; actual_parent=None if par.get("adcode") is None else str(par.get("adcode"))
                  if str(props.get("adcode"))!=code: hard.append(("ADCODE_MISMATCH",f"actual={props.get('adcode')}"))
                  if props.get("name")!=name: hard.append(("NAME_MISMATCH",f"expected={name}; actual={props.get('name')}"))
                  if props.get("level")!=meta["level"]: hard.append(("LEVEL_MISMATCH",f"expected={meta['level']}; actual={props.get('level')}"))
                  if actual_parent!=meta["parent_adcode"]: hard.append(("PARENT_MISMATCH",f"expected={meta['parent_adcode']}; actual={actual_parent}"))
                  geom=feature.get("geometry")
                  if not isinstance(geom,dict): hard.append(("GEOM_MISSING","geometry missing"))
                  else:
                      if geom.get("type") not in {"Polygon","MultiPolygon"}: hard.append(("GEOM_TYPE",f"actual={geom.get('type')}"))
                      coords=geom.get("coordinates")
                      if not coords: hard.append(("GEOM_EMPTY","coordinates empty"))
                      else:
                          n=bad=nonfinite=0
                          for lon,lat in iter_xy(coords):
                              n+=1
                              if not(math.isfinite(lon) and math.isfinite(lat)): nonfinite+=1
                              elif not(-180<=lon<=180 and -90<=lat<=90): bad+=1
                          if n==0: hard.append(("GEOM_NO_POINTS","no coordinate pairs"))
                          if nonfinite: hard.append(("GEOM_NONFINITE",f"count={nonfinite}"))
                          if bad: hard.append(("GEOM_RANGE",f"count={bad}"))
                          try:
                              sg=shape(geom)
                              if sg.is_empty: hard.append(("GEOM_SHAPELY_EMPTY","empty geometry"))
                              if not sg.is_valid: hard.append(("GEOM_INVALID",explain_validity(sg)))
                          except Exception as e: hard.append(("GEOM_SHAPELY_ERROR",repr(e)))
              for issue,msg in hard: add(code,name,"FAIL",issue,msg)
              status="PASS" if not hard else "FAIL"
              source_sha=sha256_file(src_path) if src_path.exists() else ""
              row={"asset_id":"ADM-"+code,"adcode":code,"name":name,"level":meta["level"],"parent_adcode":meta["parent_adcode"] or "","qa_status":status,"hard_issue_count":len(hard),"source_type":source_type,"source_id":source_id,"source_url":source_url,"source_sha256":source_sha,"geometry_sha256":canonical_hash(geom) if isinstance(geom,dict) else "","geometry_type":geom.get("type") if isinstance(geom,dict) else "","normalized_sha256":""}
              if status=="PASS":
                  norm={"type":"FeatureCollection","features":[{"type":"Feature","properties":{"asset_id":"ADM-"+code,"adcode":int(code),"name":name,"level":meta["level"],"parent_adcode":int(meta["parent_adcode"]) if meta["parent_adcode"] and meta["parent_adcode"].isdigit() else meta["parent_adcode"],"source_type":source_type,"source_id":source_id,"source_url":source_url,"source_sha256":source_sha,"geometry_sha256":canonical_hash(geom),"reference_commit":COMMIT,"default_role":"ACTIVE_DEFAULT_CANDIDATE","original_properties":feature.get("properties") or {}},"geometry":geom}]}
                  out=NORM/("ADM-"+code+".geojson"); out.write_text(json.dumps(norm,ensure_ascii=False,separators=(",",":")),encoding="utf-8"); row["normalized_sha256"]=sha256_file(out)
              rows.append(row)

          fields=["asset_id","adcode","name","level","parent_adcode","qa_status","hard_issue_count","source_type","source_id","source_url","source_sha256","geometry_sha256","geometry_type","normalized_sha256"]
          for fn,data in [("asset_index.csv",rows),("lock_manifest.csv",[r for r in rows if r["qa_status"]=="PASS"]),("exception_manifest.csv",[r for r in rows if r["qa_status"]=="FAIL"])]:
              with open(QA/fn,"w",encoding="utf-8-sig",newline="") as f: w=csv.DictWriter(f,fieldnames=fields); w.writeheader(); w.writerows(data)
          with open(QA/"qa_details.csv","w",encoding="utf-8-sig",newline="") as f:
              fd=["adcode","name","severity","issue_code","message"]; w=csv.DictWriter(f,fieldnames=fd); w.writeheader(); w.writerows(details)
          with open(QA/"direct_download_manifest.csv","w",encoding="utf-8-sig",newline="") as f:
              fd=["adcode","status","bytes","sha256","url","error"]; w=csv.DictWriter(f,fieldnames=fd); w.writeheader(); w.writerows(sorted(download_rows,key=lambda r:r["adcode"]))
          with open(QA/"snapshot_district_source_manifest.csv","w",encoding="utf-8-sig",newline="") as f:
              fd=["adcode","path","sha256"]; w=csv.DictWriter(f,fieldnames=fd); w.writeheader(); w.writerows([{"adcode":c,"path":str(p.relative_to(REPO)),"sha256":sha256_file(p)} for c,p in sorted(repo_district.items())])
          with open(QA/"direct_source_sha256_manifest.txt","w",encoding="utf-8") as f:
              for p in sorted(RAW_DIRECT.glob("*.json")): f.write(f"{sha256_file(p)}  {p.name}\n")

          pass_rows=[r for r in rows if r["qa_status"]=="PASS"]; fail_rows=[r for r in rows if r["qa_status"]=="FAIL"]
          pass_counts=Counter(r["level"] for r in pass_rows); fail_counts=Counter(r["level"] for r in fail_rows); issues=Counter(d["issue_code"] for d in details if d["severity"]=="FAIL")
          direct_ok=sum(r["status"]=="OK" for r in download_rows)
          fatal=[]
          if len(subnational)!=3237: fatal.append(f"expected 3237 subnational objects, got {len(subnational)}")
          if expected_counts.get("province")!=34 or expected_counts.get("city")!=363 or expected_counts.get("district")!=2840: fatal.append(f"unexpected reference level counts: {dict(expected_counts)}")
          if direct_ok < int(len(direct_targets)*0.95): fatal.append(f"direct source availability below 95%: {direct_ok}/{len(direct_targets)}")
          overall="STRUCTURAL_FAIL" if fatal else ("PASS_WITH_EXCEPTIONS" if fail_rows else "PASS")
          summary={
              "batch_id":"QA-20260907-DATAV-V3-COMBINED-ADM-DEFAULT-CANDIDATE",
              "reference_repository":"zhChuXiao/ChinaGeoJson","reference_commit":COMMIT,
              "policy":"Use locked snapshot basic district files where uniquely preserved; use direct DataV base files for all province/city assets and district gaps caused by Chinese-name filename collisions. No geometry repair.",
              "country_100000_role":"reference only; not formal China standard map",
              "expected_counts":dict(expected_counts),"expected_total":len(subnational),
              "snapshot_district_coverage":len(repo_district),"missing_snapshot_district_count":len(missing_district),"missing_snapshot_district_codes":missing_district,
              "direct_target_count":len(direct_targets),"direct_download_success":direct_ok,
              "pass_total":len(pass_rows),"fail_total":len(fail_rows),"pass_by_level":dict(pass_counts),"fail_by_level":dict(fail_counts),"fail_issue_counts":dict(issues),
              "overall_status":overall,"fatal_reasons":fatal,
              "lock_policy":"PASS -> ACTIVE DEFAULT candidate; FAIL -> unlocked exception requiring OVERRIDE or replacement; ACTIVE OVERRIDE always wins.",
              "licensing_note":"GitHub repository license and DataV upstream data rights are separate; commercial redistribution rights are not inferred from repository MIT license."
          }
          (QA/"qa_summary.json").write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding="utf-8")
          print("=== TEA_MAP_QA_V3_SUMMARY ==="); print(json.dumps(summary,ensure_ascii=False,indent=2)); print("=== END_TEA_MAP_QA_V3_SUMMARY ===")
          if fatal: raise SystemExit(2)
          PY
          python tea_map_spatial_qa_v3.py

      - name: Build packages
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundles
          if [ -d raw_direct_delta ]; then tar -czf bundles/RAW_DATAV_V3_DIRECT_DELTA_20260907.tar.gz raw_direct_delta; fi
          if [ -d qa_v3 ]; then tar -czf bundles/QA_DATAV_V3_COMBINED_20260907.tar.gz qa_v3; fi
          if [ -d normalized_pass ]; then tar -czf bundles/NORMALIZED_PASS_ADM_DATAV_V3_COMBINED_20260907.tar.gz normalized_pass; fi
          sha256sum bundles/*.tar.gz > bundles/BUNDLE_SHA256_MANIFEST.txt 2>/dev/null || true

      - name: Upload direct RAW delta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RAW-DataV-V3-DIRECT-DELTA-20260907
          path: bundles/RAW_DATAV_V3_DIRECT_DELTA_20260907.tar.gz
          if-no-files-found: warn
          retention-days: 30

      - name: Upload QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QA-DataV-V3-COMBINED-ADM-20260907
          path: bundles/QA_DATAV_V3_COMBINED_20260907.tar.gz
          if-no-files-found: warn
          retention-days: 30

      - name: Upload normalized PASS assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NORMALIZED-PASS-ADM-DataV-V3-COMBINED-20260907
          path: bundles/NORMALIZED_PASS_ADM_DATAV_V3_COMBINED_20260907.tar.gz
          if-no-files-found: warn
          retention-days: 30

      - name: Upload bundle manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MANIFEST-DataV-V3-COMBINED-ADM-20260907
          path: bundles/BUNDLE_SHA256_MANIFEST.txt
          if-no-files-found: warn
          retention-days: 30
