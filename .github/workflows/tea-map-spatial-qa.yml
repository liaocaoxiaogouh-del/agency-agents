name: Tea Map Spatial QA

on:
  push:
    branches:
      - tea-map-spatial-qa-20260907

permissions:
  contents: read

jobs:
  resolve-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout runner repository
        uses: actions/checkout@v4

      - name: Fetch page-specific app scripts and test static JSON paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p endpoint_probe
          python - <<'PY'
          import json,re,urllib.request
          from concurrent.futures import ThreadPoolExecutor,as_completed
          from pathlib import Path
          OUT=Path('endpoint_probe')
          items={
            'cq':('https://geojsoncn.com/app.js?file=%E5%B8%82%2F%E9%87%8D%E5%BA%86%E5%B8%82.json','https://geojsoncn.com/%E5%B8%82/%E9%87%8D%E5%BA%86%E5%B8%82.json'),
            'linzhi':('https://geojsoncn.com/app.js?file=%E5%B8%82%2F%E6%9E%97%E8%8A%9D%E5%B8%82.json','https://geojsoncn.com/%E5%B8%82/%E6%9E%97%E8%8A%9D%E5%B8%82.json'),
            'shannan':('https://geojsoncn.com/app.js?file=%E5%B8%82%2F%E5%B1%B1%E5%8D%97%E5%B8%82.json','https://geojsoncn.com/%E5%B8%82/%E5%B1%B1%E5%8D%97%E5%B8%82.json'),
            'hetian':('https://geojsoncn.com/app.js?file=%E5%B8%82%2F%E5%92%8C%E7%94%B0%E5%9C%B0%E5%8C%BA.json','https://geojsoncn.com/%E5%B8%82/%E5%92%8C%E7%94%B0%E5%9C%B0%E5%8C%BA.json'),
            'sansha':('https://geojsoncn.com/app.js?file=%E5%B8%82%2F%E4%B8%89%E6%B2%99%E5%B8%82.json','https://geojsoncn.com/%E5%B8%82/%E4%B8%89%E6%B2%99%E5%B8%82.json'),
          }
          UA={'User-Agent':'Mozilla/5.0 TeaMapEndpointProbe/1.0','Accept-Encoding':'identity'}
          def get(url):
            try:
              req=urllib.request.Request(url,headers=UA)
              with urllib.request.urlopen(req,timeout=15) as r:
                return {'ok':True,'status':getattr(r,'status',200),'ct':r.headers.get('Content-Type',''),'ce':r.headers.get('Content-Encoding',''),'final':r.geturl(),'data':r.read()}
            except Exception as e:return {'ok':False,'error':repr(e),'data':b''}
          summary={}
          for key,(app_url,json_url) in items.items():
            app=get(app_url); js=app.pop('data')
            if js:
              text=js.decode('utf-8','replace'); (OUT/f'{key}_app.js').write_text(text,encoding='utf-8')
              hits=[]
              for needle in ['fetch(','XMLHttpRequest','axios','file=','.json','download','geojson','FILE','DATA','mapData','source']:
                for m in list(re.finditer(re.escape(needle),text,re.I))[:50]:
                  hits.append({'needle':needle,'text':text[max(0,m.start()-300):m.start()+1000]})
              app['hits']=hits
            stat=get(json_url); b=stat.pop('data')
            if b:
              (OUT/f'{key}_static.bin').write_bytes(b)
              stat['prefix']=b[:200].decode('utf-8','replace')
              try:
                obj=json.loads(b.decode('utf-8-sig')); stat['json']=True; stat['type']=obj.get('type') if isinstance(obj,dict) else type(obj).__name__; stat['features']=len(obj.get('features',[])) if isinstance(obj,dict) else None
                (OUT/f'{key}_static.json').write_bytes(b)
              except Exception as e: stat['json']=False; stat['parse_error']=repr(e)
            summary[key]={'app':app,'static':stat}
          (OUT/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          for k,v in summary.items():
            print('###',k)
            print('APP', {x:y for x,y in v['app'].items() if x!='hits'})
            for h in v['app'].get('hits',[]):
              if any(s in h['text'].lower() for s in ['fetch(','.json','download','file','geojson']): print('HIT',json.dumps(h,ensure_ascii=False)[:4000])
            print('STATIC',v['static'])
          PY

      - name: Package and upload
        shell: bash
        run: tar -czf GEOJSONCN-ENDPOINT-PROBE-20260907.tar.gz endpoint_probe

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: GEOJSONCN-ENDPOINT-PROBE-20260907
          path: GEOJSONCN-ENDPOINT-PROBE-20260907.tar.gz
          retention-days: 30
