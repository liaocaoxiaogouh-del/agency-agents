name: Tea Map Spatial QA
on:
  push:
    branches: [tea-map-spatial-qa-20260907]
permissions:
  contents: read
jobs:
  hainan-standard-map-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Discover Xisha/Nansha official standard-map links
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p hainan_standard_map
          python - <<'PY'
          import json,re,urllib.parse,urllib.request
          from pathlib import Path
          OUT=Path('hainan_standard_map')
          UA={'User-Agent':'Mozilla/5.0 TeaMapOfficialMapDiscovery/1.0','Accept-Encoding':'identity'}
          seeds=['https://hism.mnr.gov.cn/sjkf/hndt/']
          seen=set(); queue=list(seeds); hits=[]; pages=[]
          def get(u):
            req=urllib.request.Request(u,headers=UA)
            with urllib.request.urlopen(req,timeout=15) as r:return r.geturl(),r.headers.get('Content-Type',''),r.read()
          while queue and len(seen)<80:
            u=queue.pop(0)
            if u in seen: continue
            seen.add(u)
            try: final,ct,b=get(u)
            except Exception as e:
              pages.append({'url':u,'error':repr(e)}); continue
            pages.append({'url':u,'final':final,'ct':ct,'bytes':len(b)})
            text=b.decode('utf-8','replace') if ('text' in ct.lower() or 'html' in ct.lower() or u.endswith(('.html','.htm','/'))) else ''
            if text:
              fn=OUT/f'page_{len(pages):03d}.html'; fn.write_text(text,encoding='utf-8')
              if '西沙' in text or '南沙' in text or '三沙' in text:
                for m in re.finditer(r'.{0,250}(?:西沙|南沙|三沙).{0,700}',text,re.S): hits.append({'page':final,'snippet':m.group(0)[:1200]})
              for href in re.findall(r'(?:href|src)=["\']([^"\']+)',text,re.I):
                v=urllib.parse.urljoin(final,href)
                if v.startswith('http') and ('hism.mnr.gov.cn' in urllib.parse.urlparse(v).netloc):
                  if any(x in v.lower() for x in ['hndt','2024','2025','sansha','xisha','nansha','download','file','jpg','eps','html','htm']):
                    if v not in seen and len(queue)<100: queue.append(v)
                if any(s in href.lower() for s in ['.eps','.jpg','.jpeg','.pdf']) and any(n in text for n in ['西沙','南沙','三沙']):
                  hits.append({'page':final,'asset':v})
          # collect direct asset-looking URLs found in all saved text
          assets=[]
          for p in OUT.glob('page_*.html'):
            t=p.read_text(encoding='utf-8')
            for x in re.findall(r'[^"\'<> ]+\.(?:eps|jpg|jpeg|pdf)(?:\?[^"\'<> ]*)?',t,re.I):
              assets.append(x)
          result={'visited':pages,'hits':hits[:300],'assets':assets[:500]}
          (OUT/'discovery.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('visited',len(pages),'hits',len(hits),'assets',len(assets))
          for h in hits[:100]: print('HIT',json.dumps(h,ensure_ascii=False)[:2000])
          PY
      - name: Package
        run: tar -czf HAINAN-OFFICIAL-STANDARD-MAP-DISCOVERY-20260907.tar.gz hainan_standard_map
      - uses: actions/upload-artifact@v4
        with:
          name: HAINAN-OFFICIAL-STANDARD-MAP-DISCOVERY-20260907
          path: HAINAN-OFFICIAL-STANDARD-MAP-DISCOVERY-20260907.tar.gz
          retention-days: 30
