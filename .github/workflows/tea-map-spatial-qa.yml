name: Tea Map Spatial QA

on:
  push:
    branches:
      - tea-map-spatial-qa-20260907

permissions:
  contents: read

jobs:
  geojsoncn-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout runner repository
        uses: actions/checkout@v4

      - name: Probe public current-map pages and script endpoints
        shell: bash
        run: |
          set -euo pipefail
          cat > probe.py <<'PY'
          import json, re, urllib.parse, urllib.request, time
          from pathlib import Path

          OUT=Path('geojsoncn_probe'); OUT.mkdir(exist_ok=True)
          PAGES={
            'chongqing':'https://geojsoncn.com/%E5%B8%82/%E9%87%8D%E5%BA%86%E5%B8%82.html',
            'linzhi':'https://geojsoncn.com/%E5%B8%82/%E6%9E%97%E8%8A%9D%E5%B8%82.html',
            'shannan':'https://geojsoncn.com/%E5%B8%82/%E5%B1%B1%E5%8D%97%E5%B8%82.html',
            'hetian':'https://geojsoncn.com/%E5%B8%82/%E5%92%8C%E7%94%B0%E5%9C%B0%E5%8C%BA.html',
            'sansha':'https://geojsoncn.com/%E5%B8%82/%E4%B8%89%E6%B2%99%E5%B8%82.html',
          }
          UA={'User-Agent':'Mozilla/5.0 TeaMapProbe/1.0'}
          def get(url,timeout=20):
            req=urllib.request.Request(url,headers=UA)
            with urllib.request.urlopen(req,timeout=timeout) as r:
              return getattr(r,'status',200),r.headers.get('Content-Type',''),r.read(),r.geturl()
          summary={'pages':{},'scripts':{},'interesting_strings':[],'guesses':[]}
          scripts=set()
          for key,url in PAGES.items():
            try:
              st,ct,b,final=get(url); text=b.decode('utf-8','replace')
              (OUT/f'{key}.html').write_text(text,encoding='utf-8')
              summary['pages'][key]={'status':st,'bytes':len(b),'final_url':final,'content_type':ct}
              for m in re.finditer(r'<script[^>]+src=[\"\']([^\"\']+)',text,re.I):
                scripts.add(urllib.parse.urljoin(final,m.group(1)))
              for pat in [r'https?://[^\"\'<> ]+',r'/[^\"\'<> ]*(?:geojson|json|download|api)[^\"\'<> ]*']:
                for s in re.findall(pat,text,re.I):
                  if isinstance(s,tuple): s=''.join(s)
                  if any(k in s.lower() for k in ['geojson','download','api','json']):
                    summary['interesting_strings'].append({'source':key,'value':s[:500]})
            except Exception as e:
              summary['pages'][key]={'error':repr(e)}
          for i,url in enumerate(sorted(scripts)):
            try:
              st,ct,b,final=get(url); text=b.decode('utf-8','replace')
              name=f'script_{i:02d}.js'; (OUT/name).write_text(text,encoding='utf-8')
              summary['scripts'][url]={'status':st,'bytes':len(b),'file':name}
              # extract substrings around known codes, GeoJSON and endpoint-ish terms
              needles=['500157','540481','540581','653228','653229','460302','460303','geojson','download','api/','fetch(','axios']
              for needle in needles:
                pos=0
                low=text.lower(); nlow=needle.lower()
                while True:
                  j=low.find(nlow,pos)
                  if j<0: break
                  summary['interesting_strings'].append({'source':url,'needle':needle,'value':text[max(0,j-250):min(len(text),j+500)]})
                  pos=j+len(needle)
                  if pos>j+2000: break
            except Exception as e:
              summary['scripts'][url]={'error':repr(e)}
          # Probe a small set of common direct URL conventions without assuming success.
          codes=['500157','540481','540581','653228','653229','460302','460303']
          templates=[
            'https://geojsoncn.com/data/{code}.json',
            'https://geojsoncn.com/geojson/{code}.json',
            'https://geojsoncn.com/api/geojson/{code}',
            'https://geojsoncn.com/api/region/{code}',
            'https://geojsoncn.com/api/download/{code}.geojson',
            'https://geojsoncn.com/download/{code}.geojson',
          ]
          for code in codes:
            for tpl in templates:
              url=tpl.format(code=code)
              try:
                st,ct,b,final=get(url,8)
                rec={'code':code,'url':url,'status':st,'content_type':ct,'bytes':len(b),'final_url':final,'prefix':b[:120].decode('utf-8','replace')}
                summary['guesses'].append(rec)
                if st==200 and (b.lstrip().startswith(b'{') or b.lstrip().startswith(b'[')):
                  (OUT/f'guess_{code}_{len(summary["guesses"])}.json').write_bytes(b)
              except Exception as e:
                summary['guesses'].append({'code':code,'url':url,'error':repr(e)})
              time.sleep(.03)
          # de-duplicate interesting strings by serialized value
          seen=set(); ded=[]
          for x in summary['interesting_strings']:
            k=json.dumps(x,ensure_ascii=False,sort_keys=True)
            if k not in seen:
              seen.add(k); ded.append(x)
          summary['interesting_strings']=ded[:500]
          (OUT/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print('pages',json.dumps(summary['pages'],ensure_ascii=False))
          print('script_count',len(scripts),'interesting',len(ded))
          for x in ded:
            v=x.get('value','')
            if any(c in v for c in ['500157','540481','540581','653228','653229','460302','460303']) or 'geojson' in v.lower() or 'download' in v.lower():
              print('HIT',json.dumps(x,ensure_ascii=False)[:2000])
          for g in summary['guesses']:
            if g.get('status')==200:
              print('GUESS200',json.dumps(g,ensure_ascii=False))
          PY
          python probe.py

      - name: Package probe
        shell: bash
        run: tar -czf GEOJSONCN-PROBE-CURRENT98-20260907.tar.gz geojsoncn_probe

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: GEOJSONCN-PROBE-CURRENT98-20260907
          path: GEOJSONCN-PROBE-CURRENT98-20260907.tar.gz
          retention-days: 30
